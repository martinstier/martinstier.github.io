<!DOCTYPE html>
<html lang="en">

<head>
    <title>Martin Stier's website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Link CSS file -->
    <link rel="stylesheet" type="text/css" href="index.css">

    <!-- Font-Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Computer Modern font -->
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css">
</head>

<body>
    <header class="sticky-header">
        <div class="name">
            <p><b>Martín Stier<span class="tooltiptext">Mar-teen Steer</span></b></p>
        </div>


        <div class="icons">
            <a href="mailto:mastier@umich.edu" class="icon" aria-label="Email Martin Stier">
                <i class="fas fa-envelope"></i>
            </a>

            <a href="https://www.linkedin.com/in/mart%C3%ADn-stier-45b005220/" target="_blank" class="icon"
                aria-label="Martin Stier's LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>

            <!-- <i class="fa fa-refresh" aria-hidden="true"></i> -->
        </div>
    </header>

    <main>

        <div class="portrait">
            <img src="files/MartinStierPortrait.jpg" alt="Martin Stier's portrait" class="image">
        </div>

        <div class="dropdowns">

            <button onclick=showBio() class="drop-button"><i class="fa-solid fa-caret-right"></i>&nbsp;
                Bio
            </button>

            <button onclick=showExperience() class="drop-button"><i class="fa-solid fa-caret-right"></i>&nbsp;
                Experience
            </button>

            <button onclick=showResearch() class="drop-button">
                <i class="fa-solid fa-caret-right"></i>&nbsp;
                Research
            </button>

            <button onclick=showProjects() class="drop-button"><i class="fa-solid fa-caret-right"></i>&nbsp;
                Projects
            </button>

            <a href="files/Resume.pdf" target="_blank">
                <button class="drop-button">
                    <i class="fa fa-external-link" aria-hidden="true"></i>&nbsp;
                    Resume
                </button>
            </a>

        </div>

    </main>

</body>

</html>
